services:
  db:
    image: postgres:16-alpine
    container_name: rmal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rmal
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: rmal
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: